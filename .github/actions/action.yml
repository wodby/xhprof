name: Build
description: Build xhprof image
inputs:
  version:
    description: version
    required: true
  tags:
    description: image tags
    required: true
  platform:
    description: docker platform
    required: false
    default: linux/amd64
runs:
  using: "composite"
  steps:
  - name: Build image
    id: brotli-image
    env:
      XHPROF_VER: ${{ inputs.version }}
      TAGS: ${{ inputs.tags }}
      PLATFORM: ${{ inputs.platform }}
    run: |
      set -e
      make buildx-build-amd64
      make test
      make buildx-build
      . $GITHUB_ACTION_PATH/release.sh
    shell: bash
      echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
  - name: Verify Brotli security fixes
    uses: wodby/images/.github/actions/check-brotli@4d79323d1d62295e425a222e8cb23ccf843cbbea
    with:
      image: ${{ steps.brotli-image.outputs.image }}
